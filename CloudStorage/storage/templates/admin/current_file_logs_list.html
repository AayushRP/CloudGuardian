{% extends 'CloudStorage/header.html' %}

{% block content %}
  <div class="container mt-5">
    <div class="d-flex justify-content-between">
      <h2>File Logs Overview</h2>
    </div>
    <table class="table table-striped table-bordered mt-4">
      <thead class="thead-dark">
        <tr>
          <th>SN</th>
          <th>Title</th>
          <th>Owner</th>
          <th>Uploaded At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for file in files %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ file.original_title }}</td>
            <td>{{ file.owner }}</td>
            <td>{{ file.created_at }}</td>
            <td>
              <a href="{% url 'current_file_log_details' file.file_uid %}" class="btn btn-primary btn-sm float-left">View Details</a>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="4">No files found.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
