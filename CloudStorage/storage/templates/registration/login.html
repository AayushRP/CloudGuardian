{% extends 'CloudStorage/header.html' %}
{% load static %}
{% block title %}
  Login
{% endblock %}
{% load crispy_forms_tags %}
{% block content %}
  <div class="container mt-5">
    <div class="container text-center mt-2">
      <a href="{% url 'index' %}"><img src="{% static 'storage/CloudGuardian.jpg' %}" width="300" alt="Cloud Guardian" /></a><br>
    </div>
    <form class="mt-2" method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <p>
        Don't have an account? Create one <a href="/sign-up">Here</a>!
      </p>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
  </div>
{% endblock %}
